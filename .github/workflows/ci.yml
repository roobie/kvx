name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-26.04: kvx's Linux protector needs systemd >= 256 (`systemd-creds --user`); ubuntu-latest lags.
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Facts kvx depends on that differ by OS; printed so a failing test can be traced to one.
      - name: Probe platform
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet --version
          foreach ($name in 'secrets.dev.localhost', 'vault.kvxtest.localhost') {
            try { "dns $name -> " + ([System.Net.Dns]::GetHostAddresses($name) -join ', ') }
            catch { "dns $name -> FAILED: $($_.Exception.InnerException.Message)" }
          }
          if ($IsLinux) {
            systemd-creds --version | Select-Object -First 1
            'probe' | systemd-creds encrypt --user --name=kvx-probe - - | Out-Null
            "systemd-creds --user encrypt exit $LASTEXITCODE"
          }

      - name: Probe curl resolution
        shell: bash
        continue-on-error: true
        run: |
          curl --version | head -1
          curl -sS -m 5 -o /dev/null http://secrets.dev.localhost:9/ 2>&1 || true

      # Windows and macOS keep trust only in the OS store, which a test can't write without admin rights or a prompt,
      # so CI trusts one CA machine-wide and the tests issue their certificates from it (LiveKvx.TestCa).
      - name: Trust a test CA
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          using namespace System.Security.Cryptography
          using namespace System.Security.Cryptography.X509Certificates
          $key = [RSA]::Create(2048)
          $req = [CertificateRequest]::new('CN=kvx test CA', $key, [HashAlgorithmName]::SHA256, [RSASignaturePadding]::Pkcs1)
          $req.CertificateExtensions.Add([X509BasicConstraintsExtension]::new($true, $false, 0, $true))
          $req.CertificateExtensions.Add([X509KeyUsageExtension]::new([X509KeyUsageFlags]'KeyCertSign, CrlSign', $true))
          $req.CertificateExtensions.Add([X509SubjectKeyIdentifierExtension]::new($req.PublicKey, $false))
          # Back-dated so the tests can issue already-expired certificates under it.
          $ca = $req.CreateSelfSigned([DateTimeOffset]::UtcNow.AddDays(-365), [DateTimeOffset]::UtcNow.AddDays(365))
          $pfx = Join-Path $env:RUNNER_TEMP 'kvx-test-ca.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'kvx-test-ca.cer'
          [IO.File]::WriteAllBytes($pfx, $ca.Export([X509ContentType]::Pfx, 'test'))
          [IO.File]::WriteAllBytes($cer, $ca.Export([X509ContentType]::Cert))
          if ($IsWindows) { Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null }
          else { sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain $cer }
          "KVX_TEST_CA=$pfx" >> $env:GITHUB_ENV

      - run: dotnet build Kvx.slnx -c Release

      - name: Test
        # A hanging test is named and dumped after 5 min instead of silently using up the job's timeout.
        run: dotnet test tests/Kvx.Tests -c Release --no-build --blame-hang-timeout 5m --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/Kvx.Tests/TestResults/
