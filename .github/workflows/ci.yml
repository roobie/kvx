name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Facts kvx depends on that differ by OS; printed so a failing test can be traced to one.
      - name: Probe platform
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet --version
          foreach ($name in 'secrets.dev.localhost', 'vault.kvxtest.localhost') {
            try { "dns $name -> " + ([System.Net.Dns]::GetHostAddresses($name) -join ', ') }
            catch { "dns $name -> FAILED: $($_.Exception.InnerException.Message)" }
          }
          if ($IsLinux) {
            systemd-creds --version | Select-Object -First 1
            'probe' | systemd-creds encrypt --user --name=kvx-probe - - | Out-Null
            "systemd-creds --user encrypt exit $LASTEXITCODE"
          }

      - name: Probe curl resolution
        shell: bash
        continue-on-error: true
        run: |
          curl --version | head -1
          curl -sS -m 5 -o /dev/null http://secrets.dev.localhost:9/ 2>&1 || true

      - run: dotnet build Kvx.slnx -c Release

      - name: Test
        run: dotnet test tests/Kvx.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/Kvx.Tests/TestResults/
